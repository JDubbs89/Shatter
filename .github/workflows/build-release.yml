name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-26.04
            platform: LINUX
            artifact: linux-x64
            package: linux-x64.tar.gz
          - name: Windows
            runner: windows-2022
            platform: WINDOWS
            artifact: windows-x64
            package: windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Determine package version
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              match = re.fullmatch(r'v([0-9]+\.[0-9]+\.[0-9]+)(?:-[0-9A-Za-z.-]+)?', os.environ['GITHUB_REF_NAME'])
              if not match:
                  raise SystemExit('Release tags must use vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix')
          else:
              match = re.search(r'set\(SHATTER_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"', Path('CMakeLists.txt').read_text())
          version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')

      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgmock-dev \
            libgtest-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            pipewire \
            pipewire-bin \
            pipewire-pulse \
            pkg-config \
            pulseaudio-utils \
            python3 \
            wireplumber

      - name: Install Windows GoogleTest
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install gtest:x64-windows

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '9.0.x'

      - name: Install Windows MSI packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6 --allow-roll-forward
          wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          -DSHATTER_VERSION=${{ steps.version.outputs.version }}
          -DSHATTER_PLATFORM=${{ matrix.platform }}

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=ON
          "-DSHATTER_VERSION=${{ steps.version.outputs.version }}"
          -DSHATTER_PLATFORM=${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run all platform test suites
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      - name: Package Linux binary
        if: runner.os == 'Linux'
        env:
          PACKAGE_NAME: shatter-${{ steps.version.outputs.version }}-${{ matrix.package }}
        run: |
          package_root="$RUNNER_TEMP/shatter-package"
          cmake --install build --prefix "$package_root"
          tar -czf "$RUNNER_TEMP/$PACKAGE_NAME" -C "$package_root" .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_NAME: shatter-${{ steps.version.outputs.version }}-${{ matrix.package }}
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'shatter-package'
          cmake --install build --config Release --prefix $packageRoot
          Compress-Archive -Path (Join-Path $packageRoot '*') `
            -DestinationPath (Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME)

      - name: Build Windows MSI installer
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target msi

      - name: Test Windows MSI install, upgrades, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msi = Get-Item 'build/shatter-*-windows-*.msi'
          if (@($msi).Count -ne 1) { throw 'Expected exactly one MSI installer' }
          $fixtures = Join-Path $env:RUNNER_TEMP 'shatter-upgrade-fixtures'
          $version = [version]$env:PACKAGE_VERSION
          if ($version.Build -lt 65535) {
            $nextVersion = "$($version.Major).$($version.Minor).$($version.Build + 1)"
          } elseif ($version.Minor -lt 255) {
            $nextVersion = "$($version.Major).$($version.Minor + 1).0"
          } elseif ($version.Major -lt 255) {
            $nextVersion = "$($version.Major + 1).0.0"
          } else { throw 'No higher MSI version is available for the upgrade fixture' }
          cpack --config build/CPackConfig.cmake -C Release -B $fixtures `
            -D CPACK_PACKAGE_FILE_NAME=rebuilt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build the same-version replacement fixture' }
          cpack --config build/CPackConfig.cmake -C Release -B $fixtures `
            -D CPACK_PACKAGE_FILE_NAME=upgrade -D "CPACK_PACKAGE_VERSION=$nextVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build the newer-version upgrade fixture' }
          ./tests/integration/windows-msi.ps1 -MsiPath $msi.FullName `
            -RebuiltMsiPath (Join-Path $fixtures 'rebuilt.msi') `
            -UpgradeMsiPath (Join-Path $fixtures 'upgrade.msi') `
            -ExpectedVersion $env:PACKAGE_VERSION
          Copy-Item $msi.FullName $env:RUNNER_TEMP

      - name: Show Windows packaging diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -File -Filter wix.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "WiX log: $($_.FullName)"
              Get-Content $_.FullName
            }

      - uses: actions/upload-artifact@v4
        with:
          name: shatter-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/shatter-${{ steps.version.outputs.version }}-${{ matrix.package }}
            ${{ runner.temp }}/shatter-*-windows-*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shatter-*
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.msi > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Includes one Linux x64 archive with automatic PipeWire/PulseAudio selection, and Windows x64 ZIP and MSI installers.

            The daemon detects audio-server changes and restarts automatically. PipeWire provides full mixing, PulseAudio provides prototype playback routing, and WASAPI provides playback discovery. Linux requires both PipeWire and PulseAudio client runtime libraries.

            Windows MSI installers offer optional automatic startup at sign-in. Linux archives include share/shatter/configure-startup.sh for optional systemd user startup.
          fail_on_unmatched_files: true
          files: dist/*
